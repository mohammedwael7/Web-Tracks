<!DOCTYPE html>

<head>

    <title>Login | Web Development Courses</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body class="login-body">
<div class="login-container">
            <h2><span style="font-size: 1.5em;">🔐</span> Login to Web Dev</h2>
            <form id="loginForm">
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            
    <div class="team-section">
        <h3>Built by Frontend Bros 💻🎨:</h3>
        <div class="team-container">
            <div class="team-member">
                <div class="avatar" style="background-image: url('Team/Mohamed\ Wael.jpg');"></div>
                <p>Mohamed Wael</p>
            </div>
            
            <div class="team-member">
                <div class="avatar" style="background-image: url('Team/Mohamed\ Ahmed.jpg');"></div>
                <p>Mohamed Ahmed</p>
            </div>

            <div class="team-member">
                <div class="avatar" style="background-image: url('Team/Mohamed\ abdelhamed.jpg');"></div>
                <p>Mohamed Abdelhamed</p>
            </div>

            <div class="team-member">
                <div class="avatar" style="background-image: url('Team/Mohamed\ elsayed.png');"></div>
                <p>Mohamed Elsayed</p>
            </div>
        </div>
    </div>

            <div class="login-footer-links">
                <a href="#">Forgot Password?</a>
            </div>
</div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("✅ Logged in successfully!");
            window.location.href = "Home.html";
        });
    </script>
</body>
</html>
